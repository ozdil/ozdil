<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" height="100%" role="img" aria-labelledby="bannerTitle bannerDesc">
  <title id="bannerTitle">Ozan Ozdil — Systems Architect &amp; Linux Ecosystem Engineer</title>
  <desc id="bannerDesc">Architectural header for Ozan Ozdil: Omarchy Linux Ecosystem, HANCORE Security Standard, High-Performance Rust/C++/Kotlin/QML Systems, Açık CBS, and FOSSWire.</desc>
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070a12"/>
      <stop offset="50%" stop-color="#0d1322"/>
      <stop offset="100%" stop-color="#090d18"/>
    </linearGradient>
    <linearGradient id="accentLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#131c31" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#0b101e" stop-opacity="0.95"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#1e293b" stroke-width="0.6" stroke-opacity="0.45"/>
    </pattern>
  </defs>

  <!-- Outer Frame -->
  <rect width="1200" height="320" rx="12" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="1.5"/>
  <rect width="1200" height="320" rx="12" fill="url(#grid)"/>

  <!-- Top Accent Bar -->
  <rect x="1" y="1" width="1198" height="3" rx="2" fill="url(#accentLine)"/>

  <!-- Terminal Header Strip -->
  <rect x="28" y="22" width="1144" height="32" rx="6" fill="#0b1120" stroke="#1e293b" stroke-width="1"/>
  <circle cx="46" cy="38" r="4.5" fill="#ef4444" fill-opacity="0.85"/>
  <circle cx="62" cy="38" r="4.5" fill="#f59e0b" fill-opacity="0.85"/>
  <circle cx="78" cy="38" r="4.5" fill="#10b981" fill-opacity="0.85"/>
  <text x="100" y="42" fill="#64748b" font-family="'JetBrainsMono Nerd Font', 'JetBrains Mono', monospace" font-size="11.5" font-weight="500">
    ozdil@omarchy-kernel:~ $ sysctl --profile --verify-hancore --arch=x86_64-linux
  </text>
  <text x="1154" y="42" text-anchor="end" fill="#10b981" font-family="'JetBrainsMono Nerd Font', 'JetBrains Mono', monospace" font-size="11" font-weight="600">
    [STATUS: VERIFIED // HANCORE-v2]
  </text>

  <!-- Main Identity Block -->
  <text x="36" y="108" fill="#f8fafc" font-family="'JetBrainsMono Nerd Font', 'JetBrains Mono', monospace" font-size="38" font-weight="700" letter-spacing="0.5">
    OZAN ÖZDİL
  </text>
  <rect x="315" y="83" width="174" height="26" rx="5" fill="#0f2922" stroke="#10b981" stroke-width="1"/>
  <text x="402" y="100" text-anchor="middle" fill="#34d399" font-family="'JetBrainsMono Nerd Font', 'JetBrains Mono', monospace" font-size="11.5" font-weight="600">
    SYSTEMS ARCHITECT
  </text>

  <rect x="500" y="83" width="218" height="26" rx="5" fill="#111e38" stroke="#38bdf8" stroke-width="1"/>
  <text x="609" y="100" text-anchor="middle" fill="#7dd3fc" font-family="'JetBrainsMono Nerd Font', 'JetBrains Mono', monospace" font-size="11.5" font-weight="600">
    OMARCHY LINUX ECOSYSTEM
  </text>

  <rect x="729" y="83" width="212" height="26" rx="5" fill="#1b1836" stroke="#818cf8" stroke-width="1"/>
  <text x="835" y="100" text-anchor="middle" fill="#a5b4fc" font-family="'JetBrainsMono Nerd Font', 'JetBrains Mono', monospace" font-size="11.5" font-weight="600">
    ZERO-TRUST &amp; OPSEC R&amp;D
  </text>

  <text x="36" y="142" fill="#cbd5e1" font-family="'JetBrainsMono Nerd Font', 'JetBrains Mono', monospace" font-size="14.5" font-weight="500">
    Linux User-Space Architecture • Memory-Safe Native Daemons • Cryptographic E2EE Systems • Computational Imaging
  </text>
  <text x="36" y="168" fill="#94a3b8" font-family="'JetBrainsMono Nerd Font', 'JetBrains Mono', monospace" font-size="12.5" font-weight="400">
    Core Stacks: Rust, C++, Kotlin, Modern QML, TypeScript, POSIX Shell  |  Domains: Omarchy Linux, Açık CBS, FOSSWire
  </text>

  <!-- Divider -->
  <line x1="36" y1="192" x2="1164" y2="192" stroke="#1e293b" stroke-width="1"/>

  <!-- 4 Architectural Telemetry Cards -->
  <!-- Card 1 -->
  <rect x="36" y="210" width="268" height="84" rx="8" fill="url(#cardGrad)" stroke="#1e293b" stroke-width="1.2"/>
  <rect x="36" y="210" width="4" height="84" rx="2" fill="#38bdf8"/>
  <text x="54" y="234" fill="#38bdf8" font-family="'JetBrainsMono Nerd Font', 'JetBrains Mono', monospace" font-size="11" font-weight="700">
    01 // HANCORE SECURITY STD
  </text>
  <text x="54" y="256" fill="#f1f5f9" font-family="'JetBrainsMono Nerd Font', 'JetBrains Mono', monospace" font-size="13" font-weight="600">
    Zero-Trust Host Isolation
  </text>
  <text x="54" y="276" fill="#64748b" font-family="'JetBrainsMono Nerd Font', 'JetBrains Mono', monospace" font-size="11">
    RAII Guard • Bounded I/O • 0600
  </text>

  <!-- Card 2 -->
  <rect x="322" y="210" width="268" height="84" rx="8" fill="url(#cardGrad)" stroke="#1e293b" stroke-width="1.2"/>
  <rect x="322" y="210" width="4" height="84" rx="2" fill="#10b981"/>
  <text x="340" y="234" fill="#10b981" font-family="'JetBrainsMono Nerd Font', 'JetBrains Mono', monospace" font-size="11" font-weight="700">
    02 // OMARCHY ECOSYSTEM
  </text>
  <text x="340" y="256" fill="#f1f5f9" font-family="'JetBrainsMono Nerd Font', 'JetBrains Mono', monospace" font-size="13" font-weight="600">
    30+ Native Apps &amp; Sentinels
  </text>
  <text x="340" y="276" fill="#64748b" font-family="'JetBrainsMono Nerd Font', 'JetBrains Mono', monospace" font-size="11">
    Rust • Quickshell • QML • Wayland
  </text>

  <!-- Card 3 -->
  <rect x="608" y="210" width="268" height="84" rx="8" fill="url(#cardGrad)" stroke="#1e293b" stroke-width="1.2"/>
  <rect x="608" y="210" width="4" height="84" rx="2" fill="#818cf8"/>
  <text x="626" y="234" fill="#818cf8" font-family="'JetBrainsMono Nerd Font', 'JetBrains Mono', monospace" font-size="11" font-weight="700">
    03 // COMPUTATIONAL PIPELINES
  </text>
  <text x="626" y="256" fill="#f1f5f9" font-family="'JetBrainsMono Nerd Font', 'JetBrains Mono', monospace" font-size="13" font-weight="600">
    OmaStudio RAW &amp; PolyCodex
  </text>
  <text x="626" y="276" fill="#64748b" font-family="'JetBrainsMono Nerd Font', 'JetBrains Mono', monospace" font-size="11">
    16-Bit Color • 5000p Vector PDF
  </text>

  <!-- Card 4 -->
  <rect x="894" y="210" width="270" height="84" rx="8" fill="url(#cardGrad)" stroke="#1e293b" stroke-width="1.2"/>
  <rect x="894" y="210" width="4" height="84" rx="2" fill="#f59e0b"/>
  <text x="912" y="234" fill="#f59e0b" font-family="'JetBrainsMono Nerd Font', 'JetBrains Mono', monospace" font-size="11" font-weight="700">
    04 // OPEN PLATFORMS &amp; GIS
  </text>
  <text x="912" y="256" fill="#f1f5f9" font-family="'JetBrainsMono Nerd Font', 'JetBrains Mono', monospace" font-size="13" font-weight="600">
    Açık CBS &amp; FOSSWire (17-Lang)
  </text>
  <text x="912" y="276" fill="#64748b" font-family="'JetBrainsMono Nerd Font', 'JetBrains Mono', monospace" font-size="11">
    ozanozdil.com • fosswire.org
  </text>
</svg>
