<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 240" width="100%" height="100%" role="img" aria-labelledby="archTitle archDesc">
  <title id="archTitle">HANCORE Security &amp; Systems Architecture Specification</title>
  <desc id="archDesc">Visual summary of the 5 HANCORE Linux security invariants enforced across all Omarchy and system repositories.</desc>
  <defs>
    <linearGradient id="hBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070a12"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="240" rx="12" fill="url(#hBg)" stroke="#1e293b" stroke-width="1.5"/>

  <text x="36" y="38" fill="#38bdf8" font-family="'JetBrainsMono Nerd Font', 'JetBrains Mono', monospace" font-size="12" font-weight="700" letter-spacing="1">
    HANCORE // LINUX DEFENSIVE ARCHITECTURE INVARIANTS (ENFORCED ACROSS ALL REPOSITORIES)
  </text>
  <line x1="36" y1="52" x2="1164" y2="52" stroke="#1e293b" stroke-width="1"/>

  <!-- Invariant 1 -->
  <rect x="36" y="68" width="212" height="148" rx="8" fill="#0b1120" stroke="#1e293b" stroke-width="1.2"/>
  <text x="52" y="94" fill="#38bdf8" font-family="'JetBrainsMono Nerd Font', 'JetBrains Mono', monospace" font-size="11.5" font-weight="700">
    INV-01 // PROCESS ISOLATION
  </text>
  <text x="52" y="118" fill="#f8fafc" font-family="'JetBrainsMono Nerd Font', 'JetBrains Mono', monospace" font-size="12.5" font-weight="600">
    process_group(0)
  </text>
  <text x="52" y="142" fill="#94a3b8" font-family="'JetBrainsMono Nerd Font', 'JetBrains Mono', monospace" font-size="11">
    Isolated child process
  </text>
  <text x="52" y="160" fill="#94a3b8" font-family="'JetBrainsMono Nerd Font', 'JetBrains Mono', monospace" font-size="11">
    groups with deterministic
  </text>
  <text x="52" y="178" fill="#94a3b8" font-family="'JetBrainsMono Nerd Font', 'JetBrains Mono', monospace" font-size="11">
    RAII ProcessGroupGuard
  </text>
  <text x="52" y="196" fill="#64748b" font-family="'JetBrainsMono Nerd Font', 'JetBrains Mono', monospace" font-size="10.5">
    Zero orphan subtrees
  </text>

  <!-- Invariant 2 -->
  <rect x="264" y="68" width="212" height="148" rx="8" fill="#0b1120" stroke="#1e293b" stroke-width="1.2"/>
  <text x="280" y="94" fill="#10b981" font-family="'JetBrainsMono Nerd Font', 'JetBrains Mono', monospace" font-size="11.5" font-weight="700">
    INV-02 // BOUNDED I/O CAPS
  </text>
  <text x="280" y="118" fill="#f8fafc" font-family="'JetBrainsMono Nerd Font', 'JetBrains Mono', monospace" font-size="12.5" font-weight="600">
    take(MAX_BYTES + 1)
  </text>
  <text x="280" y="142" fill="#94a3b8" font-family="'JetBrainsMono Nerd Font', 'JetBrains Mono', monospace" font-size="11">
    Strict 1 MiB ceiling on
  </text>
  <text x="280" y="160" fill="#94a3b8" font-family="'JetBrainsMono Nerd Font', 'JetBrains Mono', monospace" font-size="11">
    all file, IPC, and stream
  </text>
  <text x="280" y="178" fill="#94a3b8" font-family="'JetBrainsMono Nerd Font', 'JetBrains Mono', monospace" font-size="11">
    readers to prevent OOM
  </text>
  <text x="280" y="196" fill="#64748b" font-family="'JetBrainsMono Nerd Font', 'JetBrains Mono', monospace" font-size="10.5">
    DoS-resilient parsers
  </text>

  <!-- Invariant 3 -->
  <rect x="492" y="68" width="216" height="148" rx="8" fill="#0b1120" stroke="#1e293b" stroke-width="1.2"/>
  <text x="508" y="94" fill="#818cf8" font-family="'JetBrainsMono Nerd Font', 'JetBrains Mono', monospace" font-size="11.5" font-weight="700">
    INV-03 // ATOMIC STORAGE
  </text>
  <text x="508" y="118" fill="#f8fafc" font-family="'JetBrainsMono Nerd Font', 'JetBrains Mono', monospace" font-size="12.5" font-weight="600">
    0600 / 0700 + No Symlink
  </text>
  <text x="508" y="142" fill="#94a3b8" font-family="'JetBrainsMono Nerd Font', 'JetBrains Mono', monospace" font-size="11">
    Atomic .tmp_* rename
  </text>
  <text x="508" y="160" fill="#94a3b8" font-family="'JetBrainsMono Nerd Font', 'JetBrains Mono', monospace" font-size="11">
    persistence with strict
  </text>
  <text x="508" y="178" fill="#94a3b8" font-family="'JetBrainsMono Nerd Font', 'JetBrains Mono', monospace" font-size="11">
    symlink_metadata reject
  </text>
  <text x="508" y="196" fill="#64748b" font-family="'JetBrainsMono Nerd Font', 'JetBrains Mono', monospace" font-size="10.5">
    TOCTOU race immunity
  </text>

  <!-- Invariant 4 -->
  <rect x="724" y="68" width="212" height="148" rx="8" fill="#0b1120" stroke="#1e293b" stroke-width="1.2"/>
  <text x="740" y="94" fill="#f59e0b" font-family="'JetBrainsMono Nerd Font', 'JetBrains Mono', monospace" font-size="11.5" font-weight="700">
    INV-04 // ARG HARDENING
  </text>
  <text x="740" y="118" fill="#f8fafc" font-family="'JetBrainsMono Nerd Font', 'JetBrains Mono', monospace" font-size="12.5" font-weight="600">
    Explicit `--` &amp; Arrays
  </text>
  <text x="740" y="142" fill="#94a3b8" font-family="'JetBrainsMono Nerd Font', 'JetBrains Mono', monospace" font-size="11">
    Zero shell interpolation;
  </text>
  <text x="740" y="160" fill="#94a3b8" font-family="'JetBrainsMono Nerd Font', 'JetBrains Mono', monospace" font-size="11">
    discrete argv vectors &amp;
  </text>
  <text x="740" y="178" fill="#94a3b8" font-family="'JetBrainsMono Nerd Font', 'JetBrains Mono', monospace" font-size="11">
    strict IP/MAC allowlists
  </text>
  <text x="740" y="196" fill="#64748b" font-family="'JetBrainsMono Nerd Font', 'JetBrains Mono', monospace" font-size="10.5">
    Injection-free execution
  </text>

  <!-- Invariant 5 -->
  <rect x="952" y="68" width="212" height="148" rx="8" fill="#0b1120" stroke="#1e293b" stroke-width="1.2"/>
  <text x="968" y="94" fill="#ec4899" font-family="'JetBrainsMono Nerd Font', 'JetBrains Mono', monospace" font-size="11.5" font-weight="700">
    INV-05 // NETWORK SCOPING
  </text>
  <text x="968" y="118" fill="#f8fafc" font-family="'JetBrainsMono Nerd Font', 'JetBrains Mono', monospace" font-size="12.5" font-weight="600">
    RFC 1918 / RFC 3927
  </text>
  <text x="968" y="142" fill="#94a3b8" font-family="'JetBrainsMono Nerd Font', 'JetBrains Mono', monospace" font-size="11">
    All discovery &amp; telemetry
  </text>
  <text x="968" y="160" fill="#94a3b8" font-family="'JetBrainsMono Nerd Font', 'JetBrains Mono', monospace" font-size="11">
    bounded to private LAN,
  </text>
  <text x="968" y="178" fill="#94a3b8" font-family="'JetBrainsMono Nerd Font', 'JetBrains Mono', monospace" font-size="11">
    link-local, or loopback
  </text>
  <text x="968" y="196" fill="#64748b" font-family="'JetBrainsMono Nerd Font', 'JetBrains Mono', monospace" font-size="10.5">
    Zero external leakage
  </text>
</svg>
