      <stop offset="60%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#17132a"/>
    </linearGradient>
    <linearGradient id="spBorder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ec4899" stop-opacity="0.85"/>
      <stop offset="50%" stop-color="#8b5cf6" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.85"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="210" rx="12" fill="url(#spBg)" stroke="#2e2640" stroke-width="1.5"/>
  <rect x="1" y="1" width="1198" height="3" rx="2" fill="url(#spBorder)"/>

