<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 210" width="100%" height="100%" role="img" aria-labelledby="sponsorTitle sponsorDesc">
  <title id="sponsorTitle">Sponsor Ozan Ozdil on GitHub Sponsors</title>
  <desc id="sponsorDesc">Support independent open-source systems engineering: Omarchy Linux Ecosystem, HANCORE Security Sentinels, Açık CBS, and FOSSWire.</desc>
  <defs>
